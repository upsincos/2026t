<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>
/* 默认分享卡片（1200×630）：改完用无头 Chrome 重新截图成 static/og.png，见 AGENTS.md */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  color:#1e2029;background:#fff}
.sheet{position:absolute;inset:0;padding:74px 88px 62px;display:flex;flex-direction:column;
  background:
    radial-gradient(880px 420px at 106% -12%, rgba(52,81,178,.11), transparent 62%),
    radial-gradient(640px 380px at -6% 114%, rgba(52,81,178,.07), transparent 60%),
    linear-gradient(180deg,#ffffff 0%,#fafafc 100%)}
.rule{width:36px;height:3px;border-radius:2px;background:#3451b2}
.brand{margin-top:20px;font-size:32px;font-weight:600;letter-spacing:.08em}
.brand i{font-style:normal;font-weight:400;font-size:22px;letter-spacing:.02em;
  color:rgba(60,60,67,.5);margin-left:16px}
.mid{margin-top:auto}
.h{font-size:80px;font-weight:700;letter-spacing:-.02em;line-height:1.14}
.sub{margin-top:24px;font-size:28px;line-height:1.5;color:rgba(60,60,67,.62);letter-spacing:.01em}
.foot{margin-top:auto;padding-top:26px;border-top:1px solid #e6e7ea;
  display:flex;align-items:center;gap:12px;font-size:22px;color:rgba(60,60,67,.45);letter-spacing:.02em}
.dot{width:9px;height:9px;border-radius:2px;background:#3451b2;opacity:.6}
</style></head><body>
  <div class="sheet">
    <div class="rule"></div>
    <div class="brand">12传说</div>
    <div class="mid">
      <div class="h">交易复盘与思考</div>
      <div class="sub">记录每一次判断、执行与修正</div>
    </div>
    <div class="foot"><span class="dot"></span>upsincos.github.io/2026t</div>
  </div>
</body></html>

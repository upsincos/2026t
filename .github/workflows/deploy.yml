name: "build & deploy"

# 推送到 main：云端重建页面 → 直接发布到 GitHub Pages。
# 只发布、不向仓库写提交 —— 不会再产生「本地提交 × 机器人提交」的分叉冲突。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Build site
        run: node build.ts -o dist/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
